<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Title bar
         Two stacked rows:
           1. Drag strip — full-width grab area; OS traffic-lights overlay
              its right end (height matches `titleBarOverlay.height` in
              electron/main.js). Nothing else lives here except the save
              indicator floating at the right.
           2. Controls row — tabs on the left, modes/actions on the right.
              Has full window width to breathe because OS controls sit on
              row 1, not here. -->
    <div class="titlebar">
      <div class="titlebar-drag-strip">
        <span class="titlebar-spacer" aria-hidden="true"></span>
        <span class="titlebar-mark">Markdown Writer</span>
        <span class="save-indicator">saved</span>
      </div>
      <div class="titlebar-controls">
        <div class="tab-bar" id="tab-bar"></div>
        <div class="titlebar-drag-zone"></div>
        <div class="titlebar-actions">
          <button class="titlebar-btn titlebar-font" id="btn-font" title="Cormorant Garamond — cycle font (Ctrl+/)">
            <span class="font-label-stack">
              <span id="font-label">Cormorant Garamond</span>
              <!-- Ghost labels appended at boot from the fonts array; they
                   hold the button's width steady at the longest name. -->
            </span>
          </button>
          <span class="titlebar-divider"></span>
          <!-- View dropdown — collapses the four mode toggles (Outline / Focus
               / Typewriter / Read) into a single popover so the chrome stays
               narrow and tabs get the rest of the width. The trigger picks up
               an accent tint when any mode inside is active. -->
          <div class="view-menu">
            <button class="titlebar-btn titlebar-action view-trigger" id="btn-view" type="button" title="View options" aria-haspopup="true" aria-expanded="false">
              <span class="view-trigger-label">View</span>
              <span class="view-trigger-caret" aria-hidden="true">&#9662;</span>
            </button>
            <div class="view-dropdown" id="view-dropdown" role="menu" hidden>
              <button class="view-dropdown-item" id="btn-outline" type="button" role="menuitemcheckbox" title="Outline (F7)">
                <span class="toggle-dot" aria-hidden="true"></span>
                <span class="view-item-label">Outline</span>
                <span class="view-item-shortcut">F7</span>
              </button>
              <button class="view-dropdown-item" id="btn-focus" type="button" role="menuitemcheckbox" title="Focus mode (F8)">
                <span class="toggle-dot" aria-hidden="true"></span>
                <span class="view-item-label">Focus</span>
                <span class="view-item-shortcut">F8</span>
              </button>
              <button class="view-dropdown-item" id="btn-typewriter" type="button" role="menuitemcheckbox" title="Typewriter mode (F9)">
                <span class="toggle-dot" aria-hidden="true"></span>
                <span class="view-item-label">Typewriter</span>
                <span class="view-item-shortcut">F9</span>
              </button>
              <button class="view-dropdown-item" id="btn-read" type="button" role="menuitemcheckbox" title="Read mode (F11)">
                <span class="toggle-dot" aria-hidden="true"></span>
                <span class="view-item-label">Read</span>
                <span class="view-item-shortcut">F11</span>
              </button>
            </div>
          </div>
          <span class="titlebar-divider"></span>
          <button class="titlebar-btn titlebar-action" id="btn-open" title="Open file (Ctrl+O)">
            Open
          </button>
          <button class="titlebar-btn titlebar-action" id="btn-save-as" title="Save as… (Ctrl+Shift+S)">
            Save as
          </button>
        </div>
      </div>
    </div>

    <!-- Find / Replace bar -->
    <div class="find-bar" id="find-bar">
      <div class="find-row">
        <input type="text" id="find-input" placeholder="Find..." spellcheck="false" />
        <span class="find-count" id="find-count"></span>
        <button class="find-btn" id="find-prev" title="Previous (Shift+Enter)">&#8593;</button>
        <button class="find-btn" id="find-next" title="Next (Enter)">&#8595;</button>
        <button class="find-btn" id="find-toggle-replace" title="Toggle replace (Ctrl+H)">&#8597;</button>
        <button class="find-btn" id="find-close" title="Close (Esc)">&times;</button>
      </div>
      <div class="replace-row" id="replace-row">
        <input type="text" id="replace-input" placeholder="Replace..." spellcheck="false" />
        <button class="find-btn" id="replace-one">Replace</button>
        <button class="find-btn" id="replace-all">All</button>
      </div>
    </div>

    <!-- Bubble menu (positioned by TipTap) -->
    <div class="bubble-menu">
      <button data-action="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button data-action="italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <button data-action="strike" title="Strikethrough"><s>S</s></button>
      <span class="bubble-divider"></span>
      <button data-action="heading1" title="Heading 1">H1</button>
      <button data-action="heading2" title="Heading 2">H2</button>
      <button data-action="heading3" title="Heading 3">H3</button>
      <span class="bubble-divider"></span>
      <button data-action="blockquote" title="Quote">&ldquo;</button>
      <button data-action="bulletList" title="Bullet list">&bull;</button>
      <span class="bubble-divider"></span>
      <button data-action="link" title="Link (Ctrl+K)">&#128279;</button>
    </div>

    <!-- Link dialog -->
    <div class="link-dialog" id="link-dialog">
      <div class="link-dialog-inner">
        <label for="link-url">Link URL</label>
        <input type="text" id="link-url" placeholder="https://" spellcheck="false" />
        <div class="link-dialog-actions">
          <button id="link-remove" class="link-btn link-btn-secondary">Remove</button>
          <span class="link-dialog-spacer"></span>
          <button id="link-cancel" class="link-btn link-btn-secondary">Cancel</button>
          <button id="link-apply" class="link-btn link-btn-primary">Apply</button>
        </div>
      </div>
    </div>

    <!-- Outline sidebar (toggle: F7) -->
    <aside class="outline-sidebar" id="outline-sidebar" aria-label="Document outline">
      <div class="outline-header">Outline</div>
      <div class="outline-list" id="outline-list">
        <div class="outline-empty">No headings yet</div>
      </div>
    </aside>

    <!-- Editor -->
    <div class="editor-wrap">
      <div id="editor"></div>
    </div>

    <!-- Word count -->
    <div class="word-count">
      <span id="wc">0 words</span>
    </div>

    <!-- Drop overlay -->
    <div class="drop-overlay">
      <div class="drop-message">Drop .md file to open</div>
    </div>

    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
